name: "Bug Report"
description: "File a bug report"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report.
  - type: dropdown
    id: machine
    attributes:
      label: machine
      description: Which machine are you using?
      options:
      - Levante
      - Lumi
      - Lumi operational (specify cycle)
      - MN5
      - MN5 operational (specify cycle)
      - CI
      - HPC2020
      - Wilma
      - Others
    validations:
      required: true
  - type: dropdown
    id: catalog
    attributes:
      label: catalog
      description: Which catalog are you using?
      options:
      - ci
      - climatedt-gen2
      - climatedt-phase1
      - climatedt-o25.1
      - climatedt-o26.1
      - levante
      - nextgems4
      - obs
      - Others (specify)
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: version
      description: Which AQUA version are you using?
      options:
      - main
      - v1.1.1
      - v1.1.0
      - v1.0.1
      - v1.0.0
      - v1.0.0a*
      - v0.21.0
      - v0.20.*
      - v0.19.13
      - v0.19.12
      - v0.19.11
      - v0.19.10+op (or older)
      - v0.19.10 (or older)
      - v0.13.* (specify)
      - older (specify)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
      placeholder: Tell us what happened.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce the issue
      description: Please copy and paste any relevant code. This will be automatically formatted into code, so no need for backticks.
      render: python
  - type: textarea
    id: error
    attributes:
      label: Error messages
      description: Please copy and paste any error messages you received.
  - type: dropdown
    id: contributor
    attributes:
      label: Are you interested in making a pull request?
      description: We welcome pull requests. As an open source project, we have limited resources and a suggested fix is very helpful.
      options:
        - 'Yes'
        - 'Maybe'
        - 'No'
    validations:
      required: false
