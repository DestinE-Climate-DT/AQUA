name: AQUA macOS tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 3" # run every Wednesday at 4AM UTC

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Run tests only when specific conditions are met
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check-macos.outputs.result }}
    steps:
      - name: Check if MacOS tests should run
        id: check-macos
        run: |
          # Run tests if:
          # 1) Triggered manually (workflow_dispatch)
          # 2) Triggered by schedule
          # 3) PR has 'run MacOS label'
          # 4) Pushed to main branch
          SHOULD_RUN="false"

           if [[ "${{ contains(github.event.pull_request.labels.*.name, 'run MacOS test') }}" == "true" ]] || \
             [[ "${{ github.actor }}" == "dependabot[bot]" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            SHOULD_RUN="true"
          fi

          echo "Event: ${{ github.event_name }} | Actor: ${{ github.actor }} | Has 'dependabot' label: ${{ contains(github.event.pull_request.labels.*.name, 'run MacOS test') }}"
          echo "Result: $SHOULD_RUN"
          echo "result=$SHOULD_RUN" >> $GITHUB_OUTPUT

  aqua-mac-tests:
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos_version: macos-15
            runner: macos-15
          # GitHub's macOS 27 preview runner currently uses the xcode-27 label.
          - macos_version: macos-27
            runner: xcode-27
    name: AQUA tests (${{ matrix.macos_version }})
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      platform: ${{ matrix.runner }}
      python-versions: '["3.14"]'
      pytest-markers: 'aqua or slow or graphics or catgen or polytope'
      enable-parallel: true
      enable-coverage: false
      fail-fast: false
      enable-fdb: false
      container-image: ''
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
