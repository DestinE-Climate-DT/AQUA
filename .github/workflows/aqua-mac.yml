name: AQUA macOS tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 3" # run every Wednesday at 4AM UTC

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  aqua-mac-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos_version: macos-15
            runner: macos-15
          # GitHub's macOS 27 preview runner currently uses the xcode-27 label.
          - macos_version: macos-27
            runner: xcode-27
    name: AQUA tests (${{ matrix.macos_version }})
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      platform: ${{ matrix.runner }}
      python-versions: '["3.14"]'
      pytest-markers: 'aqua or slow or graphics or catgen'
      enable-parallel: true
      enable-coverage: false
      fail-fast: false
      enable-fdb: true
      container-image: ''
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
