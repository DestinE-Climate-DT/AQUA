name: AQUA nightly
# Builds the environment from environment.yml (no lock file) to catch dependency breakages.
# Runs weekly, manually, on Dependabot PRs, and on PRs whose label contains 'nightly'.
# The 'ubuntu-latest (FDB container)' entry runs inside the FDB container to check the FDB installation.
# When the scheduled run fails, an issue listing the broken tests is opened (or updated).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 3AM UTC

permissions:
  contents: read
  actions: read

jobs:
  aqua-nightly-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && (
        github.actor == 'dependabot[bot]' ||
        contains(join(github.event.pull_request.labels.*.name, '|'), 'dependabot') ||
        contains(join(github.event.pull_request.labels.*.name, '|'), 'nightly')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            platform: ubuntu-latest
            fdb: false
            container: ''
            markers: 'aqua or slow or graphics or catgen or polytope'
          - name: macos-latest
            platform: macos-latest
            fdb: false
            container: ''
            markers: 'aqua or slow or graphics or catgen or polytope'
          - name: FDB container
            platform: ubuntu-latest
            fdb: true
            container: 'ghcr.io/destine-climate-dt/ubuntu26.04-fdb5.19.0-eccodes2.47.0-aqua:aqua-base-container'
            markers: 'aqua or slow or polytope or fdb or graphics or catgen'
    name: AQUA nightly (${{ matrix.name }})
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      python-versions: '["3.12", "3.14"]'
      pytest-markers: ${{ matrix.markers }}
      enable-parallel: true
      enable-coverage: false
      fail-fast: false
      enable-fdb: ${{ matrix.fdb }}
      container-image: ${{ matrix.container }}
      install-mode: 'environment'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}

  report-failure:
    needs: aqua-nightly-tests
    # temporary pull_request instead of workflow to test the issue creation, until we have a better way to test it
    if: ${{ always() && github.event_name == 'pull_request' && needs.aqua-nightly-tests.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aqua-test-artifacts-*
          path: artifacts

      - name: Build failure report
        run: |
          python3 - <<'EOF'
          import glob, json, os, subprocess
          import xml.etree.ElementTree as ET

          lines = ["The scheduled nightly run failed: " + os.environ["RUN_URL"], ""]

          pages = json.loads(subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp",
               f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100"]))
          failed_jobs = [j["name"] for p in pages for j in p["jobs"] if j["conclusion"] == "failure"]
          lines += ["## Failed jobs", ""] + [f"- {n}" for n in failed_jobs] + [""]

          lines += ["## Broken tests", ""]
          found = False
          for art in sorted(glob.glob("artifacts/aqua-test-artifacts-*")):
              broken = []
              for xml in glob.glob(os.path.join(art, "**", "junit.xml"), recursive=True):
                  for case in ET.parse(xml).getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          broken.append(f"{case.get('classname')}::{case.get('name')}")
              if broken:
                  found = True
                  lines += [f"### {os.path.basename(art).removeprefix('aqua-test-artifacts-')}", ""]
                  lines += [f"- `{t}`" for t in sorted(set(broken))] + [""]
          if not found:
              lines.append("No failing test found in the junit reports: the failure happened before the tests ran "
                           "(e.g. environment creation). Check the failed jobs above.")

          with open("report.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      - name: Open or update issue
        run: |
          LABEL="nightly-failure"
          gh label create "$LABEL" --color D93F0B --description "Failure of the scheduled nightly tests" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file report.md
          else
            gh issue create --label "$LABEL" --title "Nightly tests failed ($(date -u +%Y-%m-%d))" --body-file report.md
          fi
