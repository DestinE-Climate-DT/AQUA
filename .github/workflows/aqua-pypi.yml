name: AQUA PyPI tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # run every Monday night at 3AM UTC
  push:
    branches:
      - pypi-test
      - fix-test-pypi
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Call the reusable workflow with PyPI installation
  aqua-pypi-tests:
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      pytest-markers: 'aqua or slow or polytope or graphics or catgen'
      enable-parallel: true
      enable-coverage: false
      enable-fdb: false
      fail-fast: false
      install-mode: 'pypi'
      container-image: ''
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
