name: AQUA PyPI tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 2" # run every Tuesday night at 2AM UTC
  push:
    # if you want to edit this workflow, please create pypi-test branch and push to it
    branches:
      - pypi-test

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Call the reusable workflow with PyPI installation
  aqua-pypi-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    name: AQUA PyPI (${{ matrix.platform }})
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      python-versions: '["3.12", "3.13", "3.14"]'
      pytest-markers: 'aqua or slow or graphics or catgen or polytope'
      enable-parallel: true
      enable-coverage: false
      enable-fdb: false
      install-mode: 'pypi'
      container-image: ''
      test-data-source: 'auto'
      aqua-actions-ref: ${{ github.sha }}
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}

  report-failure:
    needs: aqua-pypi-tests
    if: ${{ always() && needs.aqua-pypi-tests.result == 'failure' }}
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/report-failure-reusable.yml
    with:
      test-name: PyPI
