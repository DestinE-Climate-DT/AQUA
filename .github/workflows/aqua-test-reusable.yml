name: AQUA Test Runner (Reusable)

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        required: true
        type: string
        default: '["3.14"]'
      platform:
        description: 'GitHub Actions runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
      pytest-markers:
        description: 'Pytest markers to run (e.g., "aqua or slow")'
        required: true
        type: string
        default: 'aqua or slow or fdb or graphics or catgen'
      enable-parallel:
        description: 'Enable pytest-xdist parallel execution'
        required: false
        type: boolean
        default: true
      enable-coverage:
        description: 'Enable code coverage reporting'
        required: false
        type: boolean
        default: true
      fail-fast:
        description: 'Stop all jobs if one fails'
        required: false
        type: boolean
        default: false
      install-mode:
        description: >-
          Installation mode: "local" (checkout + conda-lock file with FDB, Linux only),
          "environment" (checkout + environment.yml),
          "release" (environment-pypi.yml + checkout),
          "pypi" (environment-pypi.yml + aqua-core from PyPI + its release tag),
          "conda" (aqua-core from conda-forge + its release tag)
        required: false
        type: string
        default: 'local'
      container-image:
        description: 'Container image to use (empty string = selected host runner, default = FDB container)'
        required: false
        type: string
        default: 'ghcr.io/destine-climate-dt/ubuntu26.04-fdb5.19.0-eccodes2.47.0-aqua:aqua-base-container'
      enable-fdb:
        description: 'Enable FDB dependencies and setup'
        required: false
        type: boolean
        default: true
      test-data-source:
        description: 'Test data source: "dvc" (DVC only), "http" (wget only), or "auto" (DVC with HTTP fallback)'
        required: false
        type: string
        default: 'auto'
    secrets:
      AQUA_GITHUB_PAT:
        required: true
      AQUA_DVC_PAT:
        required: true
      AQUA_DVC_PEM:
        required: true
      BSC_GITLAB:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      POLYTOPE_KEY:
        required: true
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  aqua_test:
    runs-on: ${{ inputs.platform }}
    continue-on-error: false

    concurrency:
      # github.event is the caller's event: PR runs cancel superseded runs, other events never do
      group: aqua-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.install-mode }}-${{ inputs.platform }}-fdb${{ inputs.enable-fdb }}-py${{ matrix.python-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    container:
      # To run FDB tests we need to use a Docker image with FDB installed.
      # Pass container-image: '' from the caller to use the selected host runner without a container.
      image: ${{ inputs.container-image }}
      options: --user root

    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    env:
      DEBIAN_FRONTEND: noninteractive
      GRID_DEFINITION_PATH: /tmp
      FDB5_CONFIG_FILE: /app/etc/fdb/config.yaml
      GITHUB_TOKEN: ${{ secrets.AQUA_GITHUB_PAT || github.token }}
      ARTIFACT_SUFFIX: ${{ inputs.install-mode }}-${{ inputs.platform }}-fdb${{ inputs.enable-fdb }}-py${{ matrix.python-version }}

    steps:
      # ========================================
      # 1. INSTALL SYSTEM DEPENDENCIES
      # ========================================

      - name: Install GH Actions dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Use sudo when not running as root (plain ubuntu-latest runner)
          SUDO=$([ "$(id -u)" = "0" ] && echo "" || echo "sudo")
          # Ubuntu dependencies (Git, curl, gpg...)
          $SUDO apt-get update && \
            $SUDO apt-get install -y \
              curl \
              git \
              jq \
              gpg

      - name: Install GH Actions dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install wget

      # ========================================
      # 2. CHECKOUT REPOSITORIES
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: AQUA

      - name: Checkout Climate-DT-catalog repository
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/Climate-DT-catalog
          path: Climate-DT-catalog
          ref: main
          token: ${{ secrets.AQUA_GITHUB_PAT }}

      - name: Check GitHub token
        if: ${{ runner.os == 'Linux' }}
        env:
          PAT_SET: ${{ secrets.AQUA_GITHUB_PAT != '' }}
        run: |
          if [ "$PAT_SET" != "true" ]; then
            echo "::warning::AQUA_GITHUB_PAT is empty (Dependabot/fork run or secret not passed): falling back to github.token"
          fi
          CODE=$(curl -s -o "$RUNNER_TEMP/rate.json" -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit)
          if [ "$CODE" != "200" ]; then
            echo "::error::GitHub token rejected (HTTP $CODE): PAT expired or lacking permissions?"
            exit 1
          fi
          REMAINING=$(jq -r '.resources.core.remaining // empty' "$RUNNER_TEMP/rate.json")
          USED=$(jq -r '.resources.core.used // empty' "$RUNNER_TEMP/rate.json")
          echo "GitHub API core requests remaining: ${REMAINING:-unknown}"
          echo "GitHub API core requests used: ${USED:-unknown}"
          if [ -n "$REMAINING" ] && [ "$REMAINING" -lt 100 ]; then
            echo "::warning::Only $REMAINING GitHub API requests left"
          fi

      - name: Checkout DVC repo
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/aqua-dvc
          path: aqua-dvc
          ref: main
          token: ${{ secrets.AQUA_DVC_PAT }}


      - name: Clone GitLab data-portfolio repository
        run: |
          git clone https://oauth2:${{ secrets.BSC_GITLAB }}@gitlab.earth.bsc.es/digital-twins/de_340-3/data-portfolio data-portfolio
          cd data-portfolio
          git checkout tags/v2.2.0

      # ========================================
      # 3. SETUP MICROMAMBA ENVIRONMENT
      # ========================================

      - name: Resolve environment for install mode
        id: resolve
        env:
          MODE: ${{ inputs.install-mode }}
          ENABLE_FDB: ${{ inputs.enable-fdb }}
        run: |
          EXTRA_ARGS=""
          case "$MODE" in
            local)
              if [ "$RUNNER_OS" != "Linux" ]; then
                echo "::error::install-mode 'local' uses a linux-64 lock file; use 'environment' on $RUNNER_OS"
                exit 1
              fi
              if [ "$ENABLE_FDB" != "true" ]; then
                echo "::error::install-mode 'local' only has a lock file with FDB; use 'environment' for runs without FDB"
                exit 1
              fi
              ENV_FILE=AQUA/conda-linux-64.lock
              ;;
            environment)
              # pip resolves '-e .' against the cwd, so point it to the checkout explicitly
              ENV_FILE="$RUNNER_TEMP/environment.yml"
              sed "s#- -e \.#- -e ${GITHUB_WORKSPACE}/AQUA#" AQUA/environment.yml > "$ENV_FILE"
              grep -q "${GITHUB_WORKSPACE}/AQUA" "$ENV_FILE" || { echo "::error::'-e .' not found in environment.yml"; exit 1; }
              ;;
            pypi|release)
              ENV_FILE=AQUA/environment-pypi.yml
              ;;
            conda)
              ENV_FILE=""
              EXTRA_ARGS="aqua-core dvc dvc-s3 pytest pytest-cov pytest-xdist pytest-timeout coverage"
              ;;
            *)
              echo "::error::Unknown install-mode '$MODE'"
              exit 1
              ;;
          esac
          echo "env-file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "extra-args=$EXTRA_ARGS" >> "$GITHUB_OUTPUT"

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        env:
          GITHUB_TOKEN: ''
        with:
          micromamba-version: 'latest'
          environment-file: ${{ steps.resolve.outputs.env-file }}
          environment-name: aqua
          generate-run-shell: false
          cache-downloads: true
          cache-environment: false
          post-cleanup: 'none'
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ steps.resolve.outputs.extra-args }}

      # ========================================
      # 4. INSTALL AQUA ON TOP OF THE ENVIRONMENT
      # ========================================

      - name: Install AQUA (local mode, using lock file)
        if: ${{ inputs.install-mode == 'local' }}
        run: |
          sed -n 's/^# pip //p' "${{ steps.resolve.outputs.env-file }}" | python -m pip install -r /dev/stdin
          cd AQUA
          python -m pip install --no-deps -e .

      - name: Install aqua-core from PyPI (PyPI mode)
        if: ${{ inputs.install-mode == 'pypi' }}
        run: python -m pip install "aqua-core[tests,fdb]"

      - name: Install local AQUA on top of environment-pypi.yml (release mode)
        if: ${{ inputs.install-mode == 'release' }}
        run: |
          cd AQUA
          python -m pip install -e ".[tests,fdb]"

      - name: Checkout the tag of the installed release (PyPI and conda mode)
        if: ${{ inputs.install-mode == 'pypi' || inputs.install-mode == 'conda' }}
        run: |
          cd AQUA
          PYPI_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('aqua-core'))")
          git fetch --tags --quiet
          echo "Installed PyPI version: $PYPI_VERSION"
          git checkout "v${PYPI_VERSION}"

      # ========================================
      # 5. SETUP DVC
      # ========================================

      - name: Create DVC pem file and configure it for the ecmwf_climatedt remote
        if: ${{ inputs.test-data-source == 'dvc' || inputs.test-data-source == 'auto' }}
        run: |
          mkdir -p $HOME/.aws
          echo "${{ secrets.AQUA_DVC_PEM }}" > $HOME/.aws/harica-root.pem
          chmod 600 $HOME/.aws/harica-root.pem
          cd aqua-dvc
          dvc remote modify --local ecmwf_climatedt ssl_verify "$HOME/.aws/harica-root.pem"
          dvc config --local cache.dir "$HOME/.dvc/cache"

      - name: Configure AWS credentials for DVC
        if: ${{ inputs.test-data-source == 'dvc' || inputs.test-data-source == 'auto' }}
        run: |
          cat >$HOME/.aws/credentials << EOF
          [ecmwf_climatedt]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

      - name: Pull DVC data and move to the right folder
        if: ${{ inputs.test-data-source == 'dvc' || inputs.test-data-source == 'auto' }}
        id: dvc-pull
        continue-on-error: ${{ inputs.test-data-source == 'auto' }}
        timeout-minutes: 5
        run: |
          cd aqua-dvc
          git checkout main
          dvc pull -R data-tests/*
          mkdir -p ../AQUA/AQUA_tests
          mv data-tests/* ../AQUA/AQUA_tests

      - name: Download test data via HTTP (fallback or direct)
        if: ${{ inputs.test-data-source == 'http' || (inputs.test-data-source == 'auto' && steps.dvc-pull.outcome == 'failure') }}
        run: |
          echo "========================================"
          echo "Downloading test data from HTTP source"
          echo "========================================"
          mkdir -p AQUA/AQUA_tests
          cd AQUA/AQUA_tests
          wget -nv -r -np -nH -R "index.html*" --cut-dirs=3 http://wilma.to.isac.cnr.it/paolo/aqua-tests/data-tests/
          echo "Test data downloaded"

      # ========================================
      # 6. SETUP FDB (if enabled)
      # ========================================

      - name: Set up FDB
        if: ${{ inputs.enable-fdb == true }}
        run: |
          rm -rf /app/
          cp -r ./AQUA/AQUA_tests/fdb/ /app/
          cat /app/etc/fdb/config.yaml
          mkdir -pv /app/localroot/
          cd /app/
          fdb-write sample_test_data.grib
          fdb-write sample_test_data_d1.grib
          ls -l /app/localroot
          # The fdb-list command is a good smoke test.
          fdb-list class=ea,expver=0001
          # But the fdb-read using a request is more like what pyfdb does.
          # When it fails, the test.grib file will have 0 (zero) messages.
          fdb-read sample_test_data_fdb_request test.grib
          grib_dump test.grib

      # ========================================
      # 7. SETUP AQUA
      # ========================================

      - name: Set up AQUA
        run: |
          # Initialize the AQUA catalog in the $HOME/.aqua folder
          aqua -vv install github
          # Add the climatedt-phase1 catalog and the climatedt-gen2 catalog (for polytope testing)
          aqua -vv add climatedt-phase1
          aqua -vv add climatedt-gen2
          # Add the ci/cd catalog
          aqua -vv add ci
          # Double check the catalogs
          aqua -vv list
          # add default paths to the config
          cat >> $HOME/.aqua/config-aqua.yaml <<EOF
          paths:
              grids: ./AQUA_tests/grids
              weights: ./AQUA_tests/weights
              areas: ./AQUA_tests/weights
          EOF
          # Set up polytope secrets
          cat >$HOME/.polytopeapirc << EOF
          {
            "user_key": "${{ secrets.POLYTOPE_KEY }}"
          }
          EOF

      - name: Save environment information
        run: |
          cd AQUA
          micromamba list > micromamba_list.txt
          pip freeze > pip_freeze.txt

      # ========================================
      # 8. RUN TESTS
      # ========================================

      - name: Run tests
        timeout-minutes: 40
        env:
          MARKERS: ${{ inputs.pytest-markers }}
          PARALLEL: ${{ inputs.enable-parallel }}
          COVERAGE: ${{ inputs.enable-coverage }}
        run: |
          cd AQUA
          ARGS=(--timeout=300 --junitxml=junit.xml -o junit_family=legacy -m "$MARKERS")
          if [ "$PARALLEL" = "true" ]; then
            # xdist_group markers run on dedicated workers
            ARGS+=(-n 4 --dist loadgroup --max-worker-restart=3)
          fi
          if [ "$COVERAGE" = "true" ]; then
            ARGS+=(--cov)
          fi
          echo "pytest ${ARGS[*]}"
          pytest "${ARGS[@]}" 2>&1 | tee aqua_pytest.log

      - name: Generate coverage reports
        if: ${{ inputs.enable-coverage && !cancelled() }}
        continue-on-error: true
        run: |
          cd AQUA
          coverage xml
          coverage report

      - name: Show xdist worker log (on test failure or timeout)
        if: failure() && inputs.enable-parallel
        run: |
          LOG=AQUA/.pytest_cache/xdist_worker_tests.log
          if [ -f "$LOG" ]; then
            echo "========== xdist worker test log (last 'started' per worker = likely hung test) =========="
            cat "$LOG"
            echo "========== Last 'started' line per worker =========="
            awk -F'\t' '$2=="started" { last[$1]=$0 } END { for (w in last) print last[w] }' "$LOG" || true
          else
            echo "No xdist worker log found at $LOG"
          fi

      # ========================================
      # 9. UPLOAD COVERAGE REPORTS TO CODECOV
      # ========================================

      - name: Upload coverage reports to Codecov
        if: ${{ inputs.enable-coverage && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: AQUA/coverage.xml
          flags: unittests
          name: codecov-aqua

      - name: Upload test results to Codecov
        if: ${{ inputs.enable-coverage && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: AQUA/junit.xml

      # ========================================
      # 10. UPLOAD ARTIFACTS
      # ========================================

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: aqua-test-artifacts-${{ env.ARTIFACT_SUFFIX }}
          # .pytest_cache (including the xdist worker log) is hidden
          include-hidden-files: true
          path: |
            AQUA/coverage.xml
            AQUA/junit.xml
            AQUA/.pytest_cache
            AQUA/aqua_pytest.log
            AQUA/micromamba_list.txt
            AQUA/pip_freeze.txt
          if-no-files-found: ignore
