name: AQUA tests
# Lean feature tests: ubuntu-latest, Python 3.14, FDB container, conda-lock environment.
# Runs on PRs labelled 'run tests', 'ready for review' or 'ready to merge', on push to main, or manually.
# Environment/Dependabot checks live in aqua-nightly.yml, release checks in aqua-release.yml.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && (
        contains(join(github.event.pull_request.labels.*.name, '|'), 'run tests') ||
        contains(join(github.event.pull_request.labels.*.name, '|'), 'ready for review') ||
        contains(join(github.event.pull_request.labels.*.name, '|'), 'ready to merge')))
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      python-versions: '["3.14"]'
      pytest-markers: 'aqua or slow or polytope or fdb or graphics or catgen'
      enable-parallel: true
      enable-coverage: true
      fail-fast: false
      install-mode: 'local'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
