name: AQUA tests
# Lean feature tests: ubuntu-latest, Python 3.14, FDB container, conda-lock environment.
# Runs on PRs labelled 'run tests', on Dependabot PRs, on push to main, or manually.
# 'aqua-tests / aqua_test (3.14)' is a required check, so it must run (not be skipped) on every Dependabot PR.
# Dependency bumps are tested against environment.yml in aqua-nightly.yml, release checks live in aqua-release.yml.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-tests:
    # Non-PR events (listed first) always run. On PRs:
    #  - opened/synchronize/reopened: run if the PR is from Dependabot or has the 'run tests' label
    #  - labeled: run only if the label just added is 'run tests', so that adding
    #    an unrelated label does not restart (and cancel) tests already running
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.action != 'labeled' && (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|run tests'))) ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'run tests'))
    uses: ./.github/workflows/aqua-test-reusable.yml
    with:
      python-version: '3.14'
      pytest-markers: 'aqua or console or polytope or fdb or graphics or catgen'
      enable-parallel: true
      enable-coverage: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      install-mode: 'local'
      test-data-source: 'auto'
      aqua-actions-ref: ${{ github.sha }}
    secrets:
      AQUA_TOKEN: ${{ secrets.AQUA_CORE_TOKEN }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      BSC_GITLAB: ${{ secrets.BSC_GITLAB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
