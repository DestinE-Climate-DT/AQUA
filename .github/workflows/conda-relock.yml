name: relock conda
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # run every Monday night at 4AM UTC

concurrency:
  group: conda-relock-${{ github.event.pull_request.head.ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  relock:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, '|'), 'conda-relock'))
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: target-branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target_branch="$PR_HEAD_REF"
          else
            target_branch="main"
          fi
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "relock_branch=relock-conda-to/$target_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target-branch.outputs.target_branch }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: relock-env
          create-args: >-
            python
            conda-lock
          condarc: |
            channels:
              - conda-forge

      - name: Relock with FDB
        shell: bash -l {0}
        run: |
          conda-lock lock --file environment.yml --file pyproject.toml -p linux-64 -k explicit -e tests -e fdb

      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AQUA_GITHUB_PAT }}
          commit-message: relock with conda-lock
          title: "[Conda-Lock] Relock AQUA-core for ${{ steps.target-branch.outputs.target_branch }}"
          body: "This PR was automatically generated by the conda-lock workflow and targets `${{ steps.target-branch.outputs.target_branch }}`."
          branch: ${{ steps.target-branch.outputs.relock_branch }}
          base: ${{ steps.target-branch.outputs.target_branch }}
          delete-branch: true
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          labels: |
            run tests
