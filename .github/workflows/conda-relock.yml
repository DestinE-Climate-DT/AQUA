name: relock conda
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # run every Monday night at 4AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  relock:
    # Non-PR events always run. On PRs (only 'labeled' events trigger this workflow) run only if the
    # label just added starts with 'conda-lock': adding other labels later does not relock again
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        startsWith(github.event.label.name, 'conda-lock'))
    # Job-level concurrency: a run skipped by the condition above never enters the group, so adding another
    # label together with 'conda-lock' does not cancel the real relock (workflow-level concurrency would)
    concurrency:
      group: conda-relock-${{ github.event.pull_request.head.ref || 'main' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: target-branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target_branch="$PR_HEAD_REF"
          else
            target_branch="main"
          fi
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "relock_branch=relock-conda-to/$target_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target-branch.outputs.target_branch }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: relock-env
          create-args: >-
            python
            conda-lock
          condarc: |
            channels:
              - conda-forge

      - name: Relock with FDB
        shell: bash -l {0}
        # --filter-extras: solve only the requested extras. Otherwise the self-referencing 'all' extra
        # (aqua-core[fdb], ...) is resolved against aqua-core from PyPI, whose pins can conflict with ours
        run: |
          conda-lock lock --file environment.yml --file pyproject.toml -p linux-64 -k explicit -e tests -e fdb --filter-extras

      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AQUA_GITHUB_PAT }}
          commit-message: relock with conda-lock
          title: "[Conda-Lock] Relock AQUA-core for ${{ steps.target-branch.outputs.target_branch }}"
          body: "This PR was automatically generated by the conda-lock workflow and targets `${{ steps.target-branch.outputs.target_branch }}`."
          branch: ${{ steps.target-branch.outputs.relock_branch }}
          base: ${{ steps.target-branch.outputs.target_branch }}
          delete-branch: true
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          labels: |
            run tests :runner:
