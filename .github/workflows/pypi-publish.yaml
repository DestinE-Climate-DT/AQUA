name: Upload Python Package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g., v1.2.3)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # for PyPI trusted publishing

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "❌ No tag specified"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: $TAG"

      - name: Check if tag exists
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "✅ Tag $TAG exists"
          else
            echo "❌ Tag $TAG does not exist"
            exit 1
          fi

  deploy:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aqua-core/

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Verify version matches tag
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(python -c "exec(open('aqua/core/version.py').read()); print(__version__)")
          TAG_VERSION="${TAG#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! Package version ($PACKAGE_VERSION) != Tag ($TAG_VERSION)"
            exit 1
          fi

          echo "✅ Version matches tag"

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check dist/*

      - name: List package contents
        run: |
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true

      - name: Create summary
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          {
            echo "## 🎉 Package Published Successfully!"
            echo ""
            echo "- **Tag:** $TAG"
            echo "- **Package:** aqua-core"
            echo ""
            echo "🔗 [View on PyPI](https://pypi.org/project/aqua-core/)"
          } >> "$GITHUB_STEP_SUMMARY"
