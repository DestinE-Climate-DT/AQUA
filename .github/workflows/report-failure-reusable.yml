name: Report test failure (reusable)

# Can be called from other repositories (e.g. aqua-diagnostics):
#   uses: DestinE-Climate-DT/AQUA/.github/workflows/report-failure-reusable.yml@main
# The github context and token are the caller's, so the issue is opened in the calling repository.

on:
  workflow_call:
    inputs:
      test-name:
        description: Name of the test suite that failed
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report-failure:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TEST_NAME: ${{ inputs.test-name }}
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aqua-test-artifacts-*
          path: artifacts

      - name: Build failure report
        run: |
          python3 - <<'EOF'
          import glob, json, os, subprocess
          import xml.etree.ElementTree as ET

          test_name = os.environ["TEST_NAME"]
          lines = [f"The {test_name} test run failed: " + os.environ["RUN_URL"], ""]

          pages = json.loads(subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp",
               f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100"]))
          failed_jobs = [j["name"] for p in pages for j in p["jobs"] if j["conclusion"] == "failure"]
          lines += ["## Failed jobs", ""] + [f"- {n}" for n in failed_jobs] + [""]

          lines += ["## Broken tests", ""]
          found = False
          for xml in sorted(glob.glob(os.path.join("artifacts", "**", "junit.xml"), recursive=True)):
              broken = []
              for case in ET.parse(xml).getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      broken.append(f"{case.get('classname')}::{case.get('name')}")
              if broken:
                  found = True
                  artifact_name = os.path.basename(os.path.dirname(xml))
                  lines += [f"### {artifact_name.removeprefix('aqua-test-artifacts-')}", ""]
                  lines += [f"- `{test}`" for test in sorted(set(broken))] + [""]
          if not found:
              lines.append("No failing test found in the junit reports: the failure happened before the tests ran "
                           "(e.g. environment creation). Check the failed jobs above.")

          with open("report.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      - name: Open or update issue
        run: |
          # One label per test suite (e.g. 'ci-failure:nightly :clown_face:'), so failures of different suites do not mix
          LABEL="ci-failure:$(echo "$TEST_NAME" | tr '[:upper:]' '[:lower:]') :clown_face:"
          # Create the label on first use; ignore the error if it already exists
          gh label create "$LABEL" --color B60205 --description "Automatic report of a failed $TEST_NAME test run" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number,title --jq '.[0] // empty')
          TODAY=$(date -u +%Y-%m-%d)
          if [ -n "$EXISTING" ]; then
            NUMBER=$(echo "$EXISTING" | jq -r .number)
            # Failure count is stored in the title, e.g. "(3 failures, last: 2026-11-03)"; default to 1 if missing
            COUNT=$(echo "$EXISTING" | jq -r '.title | capture("\\((?<n>[0-9]+) failures?,").n // 1')
            COUNT=$((COUNT + 1))
            # Editing the title and commenting both bump "updated", so the issue tops the "Recently updated" sort
            gh issue edit "$NUMBER" --title "[CI/CD] $TEST_NAME tests failed ($COUNT failures, last: $TODAY)"
            { echo "### Failure $TODAY - $RUN_URL"; echo; cat report.md; } > comment.md
            gh issue comment "$NUMBER" --body-file comment.md
          else
            gh issue create --label "$LABEL" --type Bug --title "[CI/CD] $TEST_NAME tests failed (1 failure, last: $TODAY)" --body-file report.md
          fi
