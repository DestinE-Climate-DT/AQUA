# Defaults applied to every source: data models and unit handling.

defaults:
  # Data model of the source data, if not specified by the fixer
  src_datamodel: cf
  # Data model (axes names and directions) of the output coordinates
  dst_datamodel: cds

  units:
    # Shortcuts usable as {name} in the fixes
    shortname:
      mass_flux: kg m-2 s-1
      radiation_flux: W m-2
      temperature: K
    # Units not recognized by metpy, mapped to a valid equivalent
    fix:
      "1": "dimensionless"
      "deg C": "degC"
      "mm 3h-1": "mm/(3h)"
      "m of water equivalent": "m"
      "m of water s**-1": "m s**-1"
      "m of water": "m"
      "C": "degC"
      "(0 - 1)": "frac"
      "Celsius": "degC"
      "0.001": "g kg**-1"
      "1e-3": "g kg**-1"
