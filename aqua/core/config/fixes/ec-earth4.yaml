# EC-Earth4 fixes (CMOR-like output from XIOS).

fixer_name:
  # IFS atmosphere
  ec-earth4-ifs:
    convention: eccodes
    coords:
      time:
        source: time_counter
      plev:
        source: pressure_levels
    delete:
      - time_centered
      - time_centered_bounds
      - time_counter_bounds
      - bounds_lon
      - bounds_lat
      - rlut
      - rsut
      - hfls
      - hfss
      - evspsbl
    vars:
      # CMOR variables requiring a sign change
      tnswrf:
        derived: rsdt-rsut
        grib: 260671
      tnlwrf:
        derived: -rlut
        grib: 260672
      slhtf:  # surface latent heat net flux
        derived: -hfls
        grib: 260002
      ishf:  # surface sensible heat net flux
        derived: -hfss
        grib: 231
      ie:  # evaporation or moisture flux
        derived: -evspsbl
        grib: 232
      # Non-CMOR variables
      snlwrf:  # surface net long-wave radiation flux
        source: rlns
        grib: 260099
      snswrf:  # surface net short-wave radiation flux
        source: rsns
        grib: 260089
      tnlwrfcs:  # top net long-wave radiation flux, clear sky
        source: rlntcs
        grib: 260675
      tnswrfcs:  # top net short-wave radiation flux, clear sky
        source: rsntcs
        grib: 260674
      tciw:  # total column cloud ice water
        source: iwp
        grib: 79
      hcc:  # high cloud cover
        source: clh
        grib: 3075
      lcc:  # low cloud cover
        source: cll
        grib: 3073
      mcc:  # medium cloud cover
        source: clm
        grib: 3074

  # NEMO ocean
  ec-earth4-nemo:
    convention: eccodes
    dims:
      time:
        source: time_counter
      level:
        source: deptht
      x:
        source: x_grid_T
      y:
        source: y_grid_T
    coords:
      time:
        source: time_counter
      level:
        source: deptht
      lat:
        source: nav_lat_grid_T
      lon:
        source: nav_lon_grid_T
    vars:  # placeholder, see issue #1127
      dummy:
        source: not-existing

  # NEMO sea ice (SI3)
  ec-earth4-nemo-ice:
    convention: eccodes
    coords:
      time:
        source: time_counter
      lat:
        source: nav_lat
      lon:
        source: nav_lon
    delete:
      - time_centered
    vars:
      sivol:
        source: sivolu
      sithick:
        source: sithic
