# ICON fixes.

fixer_name:
  # nextGEMS: ICON-default is the parent of the cycle3/cycle4 fixes
  ICON-default:
    convention: eccodes
    data_model: false
    delete:
      - hfls
      - hfss
      - rlus
      - rlut
      - rsus
      - rsdt
      - rsut
    vars:
      siconc:
        src_units: frac
      tprate:
        src_units: kg m**-2 s**-1
      lsprate:
        src_units: kg m**-2 s**-1
      snlwrf:
        derived: rlds-rlus
      tnlwrf:
        derived: -rlut
      snswrf:
        derived: rsds-rsus
      tnswrf:
        derived: rsdt-rsut
      q:
        src_units: kg/kg

  ICON-cycle3:
    parent: ICON-default
    convention: eccodes
    vars:
      msl:
        source: pres_msl
        src_units: Pa
      tos:
        source: ts
        grib: false
        units: K
        src_units: K

  ICON-cycle4:
    parent: ICON-default
    convention: eccodes
    timeshift: -1

  # HEALPix output (ci catalog)
  ICON-hpx:
    convention: eccodes
    data_model: false
    vars:
      msl:
        src_units: Pa
      2t:
        src_units: K
      10si:
        source: 10m_wind_speed
        src_units: m/s
        grib: 207

  # ClimateDT phase1: icon-destine-v1 is the parent of the -ssp370 and -hist fixes
  icon-destine-v1:
    convention: eccodes
    deltat: 3600
    vars:
      ie:
        src_units: m
      tsrwe:
        src_units: m
      # ICON wind stresses must not be decumulated
      iews:
        source: 140101
        grib: true
      inss:
        source: 140102
        grib: true

  # Radiative fluxes are available only from mindate
  icon-destine-v1-ssp370:
    parent: icon-destine-v1
    convention: eccodes
    vars:
      tnswrf:
        mindate: 2020-09-01T00:00
      tnlwrf:
        mindate: 2020-09-01T00:00
      snswrf:
        mindate: 2020-09-01T00:00
      snlwrf:
        mindate: 2020-09-01T00:00

  icon-destine-v1-hist:
    parent: icon-destine-v1
    convention: eccodes
    vars:
      tnswrf:
        mindate: 1991-03-01T00:00
      tnlwrf:
        mindate: 1991-03-01T00:00
      snswrf:
        mindate: 1991-03-01T00:00
      snlwrf:
        mindate: 1991-03-01T00:00

  # Identical to climatedt-phase2-ICON-freeze in climatedt.yaml
  icon-destine-v1-lra:
    convention: eccodes
    vars:
      tcc:
        src_units: frac

  icon-destine-lra-story-2017-control:
    convention: eccodes
    vars:
      tos:
        src_units: degC
