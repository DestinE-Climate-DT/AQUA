# Fixes used by the AQUA test suite (ci catalog).

fixer_name:
  ifs-ci-test:
    convention: eccodes
    deltat: 3600
    jump: month
    vars:
      2t:
        attributes:
          donald: "duck"
      tnlwrf:  # merged with the eccodes convention, which provides the GRIB details
        decumulate: true
        attributes:
          description: "Top thermal radiation originally found in the dataset and decumulated"
      mtntrf:  # old shortname, auto unit conversion from eccodes properties
        derived: ttr
        grib: true
        decumulate: true
      var235:  # GRIB code as target, adding a constant
        derived: 2t+1.0
        grib: true
      mtntrf2:  # derived variable, double the normal amount
        derived: ttr+ttr
        src_units: J m-2
        decumulate: true
        units: "{radiation_flux}"
        attributes:
          long_name: Mean top net thermal radiation flux doubled
          paramId: "999179"

  ifs-ci-mindate:
    parent: ifs-ci-test
    vars:
      2t:
        mindate: 2020-08-01T00:00

  ifs-ci-timestep:
    parent: ifs-ci-test
    timeshift: -24

  ifs-ci-pandas:
    parent: ifs-ci-test
    timeshift: -19D

  ifs-ci-nodeltat:
    convention: eccodes
    jump: month
    vars:
      tnlwrf:
        decumulate: true
        attributes:
          description: "Top thermal radiation originally found in the dataset and decumulated"

  ifs-ci-coords:
    coords:
      tempodipippo:
        source: time
    dims:
      cellspippo:
        source: cell

  ci-teleconnections:
    data_model: false
    delete:
      - valid_time
      - surface
      - step
      - number

  FESOM-test:
    parent: FESOM-default
    data_model: false
    vars:
      mlotst125:
        source: MLD2
        src_units: m
        grib: true
        attributes:
          uncle: "scrooge"

  FESOM-change-coords:
    parent: FESOM-default
    data_model: false
    coords:
      level:
        source: nz1
        tgt_units: "a lot of water"

  test-fesom-3d:
    convention: eccodes
    delete: [healpix]
    vars:
      thetao:  # degC written with K as unit name
        src_units: degC
