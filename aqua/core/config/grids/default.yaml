# Regridder configuration: filename templates and generic grids.
# Grid definitions are split across all the YAML files of this folder,
# which are merged at load time: every grid name must be defined only once.
#
# Any valid CDO grid name (e.g. r360x180, F256, hpz7) can also be passed
# directly to the Reader without a dedicated entry.
#
# Available keys for each grid entry:
#   path: grid file or CDO grid name, or a dictionary {vertical_dim: path}
#   space_coord: horizontal dimensions of the source data
#   vert_coord: vertical dimension of the source data
#   cdo_options: extra CDO options (e.g. --force)
#   cdo_extra: extra CDO operators applied before generating the weights
#   cellareas, cellareas_var: precomputed cell area file and variable
#   regrid_method: interpolation method (default: con)
#   masked: variables/attributes selecting the masked (2dm) grid

# Filename templates
weights:
  template_default: weights_{model}_{exp}_{source}_{method}_{targetgrid}_l{level}.nc
  template_grid: weights_{sourcegrid}_{method}_{targetgrid}_l{level}.nc
areas:
  template_default: cell_area_{model}_{exp}_{source}.nc
  template_grid: cell_area_{grid}.nc
cdo-paths:
  download: "{{ weights }}"
  icon: /pool/data/ICON

grids:
  # Generic regular lon-lat grids, read from the data
  lon-lat:
    space_coord: ["lon", "lat"]
  lon-lat-depth:
    space_coord: ["lon", "lat"]
    vert_coord: ["depth"]
  longitude-latitude:
    space_coord: ["longitude", "latitude"]
  lon-lat-r100:
    path:
      2d: "{{ grids }}/lonlat/r100_grid.nc"
    space_coord: ["lon", "lat"]

  # Regular lon-lat target grids: rXXXs are staggered (poles included)
  r005s: r7200x3601
  r005: r7200x3600
  r010s: r3600x1801
  r010: r3600x1800
  r020s: r1800x901
  r020: r1800x900
  r025s: r1440x721
  r025: r1440x720
  r050s: r720x361
  r050: r720x360
  r100s: r360x181
  r100: r360x180
  r200s: r180x91
  r200: r180x90
  r250s: r144x73
  r250: r144x72
