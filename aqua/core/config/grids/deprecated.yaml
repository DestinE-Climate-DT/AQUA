# Deprecated grids.
# Not used by any catalog of Climate-DT-catalog, by catgen or by the test suite
# as of October 2026. Still loaded for backward compatibility:
# candidates for removal in a future release.

grids:
  # HEALPix ring ordering
  hpz0-ring:
    path: '{{ grids }}/HealPix/hpz0_ring_atm.nc'
    cdo_options: '--force'
  hpz1-ring:
    path: '{{ grids }}/HealPix/hpz1_ring_atm.nc'
    cdo_options: '--force'
  hpz2-ring:
    path: '{{ grids }}/HealPix/hpz2_ring_atm.nc'
    cdo_options: '--force'
  hpz3-ring:
    path: '{{ grids }}/HealPix/hpz3_ring_atm.nc'
    cdo_options: '--force'
  hpz4-ring:
    path: '{{ grids }}/HealPix/hpz4_ring_atm.nc'
    cdo_options: '--force'
  hpz5-ring:
    path: '{{ grids }}/HealPix/hpz5_ring_atm.nc'
    cdo_options: '--force'
  hpz6-ring:
    path: '{{ grids }}/HealPix/hpz6_ring_atm.nc'
    cdo_options: '--force'
  hpz7-ring:
    path: '{{ grids }}/HealPix/hpz7_ring_atm.nc'
    cdo_options: '--force'
  hpz8-ring:
    path: '{{ grids }}/HealPix/hpz8_ring_atm.nc'
    cdo_options: '--force'
  hpz9-ring:
    path: '{{ grids }}/HealPix/hpz9_ring_atm.nc'
    cdo_options: '--force'
  hpz10-ring:
    path: '{{ grids }}/HealPix/hpz10_ring_atm.nc'
    cdo_options: '--force'

  # IFS
  tco3999:
    path: '{{ grids }}/IFS/tco3999_grid.nc'
  ifs-interpolated:
    path: '{{ grids }}/IFS/ifs_interpolated5400x2700.nc'
    space_coord: ["lon", "lat"]
  ifs-healpix:
    path: '{{ grids }}/HealPix_old/ifs_hpx10.nc'
    space_coord: ["ncells"]
  # multIO regular grids stored as unstructured (nextGEMS)
  multio-r025s-unstructured:
    path: '{{ grids }}/IFS/ifs-multiIO-r025s.nc'
    space_coord: ["value"]
    cellareas: '{{ grids }}/IFS/cell_area_ifs-multiIO-r025s.nc'
    cellareas_var: cell_area
  multio-r100s-unstructured:
    path: '{{ grids }}/IFS/ifs-multiIO-r100s.nc'
    space_coord: ["value"]
    cellareas: '{{ grids }}/IFS/cell_area_ifs-multiIO-r100s.nc'
    cellareas_var: cell_area

  # FESOM v1: ClimateDT phase1, before the 2023 land-sea mask update
  fesom-NG5-hpz5-nested-v1:
    path: '{{ grids }}/HealPix/fesom-NG5_hpz5_nested_oce_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-NG5-hpz5-nested-3d-v1:
    path:
      level: '{{ grids }}/HealPix/fesom-NG5_hpz5_nested_oce_level_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-NG5-hpz7-nested-v1:  # 53512 missing values
    path: '{{ grids }}/HealPix/fesom-NG5_hpz7_nested_oce_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-NG5-hpz7-nested-3d-v1:
    path:
      level: '{{ grids }}/HealPix/fesom-NG5_hpz7_nested_oce_level_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-NG5-hpz9-nested-v1:  # 923769 missing values
    path: '{{ grids }}/HealPix/fesom-NG5_hpz9_nested_oce_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-NG5-hpz9-nested-3d-v1:
    path:
      level: '{{ grids }}/HealPix/fesom-NG5_hpz9_nested_oce_level_v1.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  # FESOM DARS v3, replaced by DARS2 v4
  fesom-DARS-hpz7-nested-v3:
    path: '{{ grids }}/FESOM/fesom-DARS_hpz7_nested_oce_v3.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  fesom-DARS-hpz7-nested-3d-v3:
    path:
      level: '{{ grids }}/FESOM/fesom-DARS_hpz7_nested_oce_level_v3.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  # FESOM interpolated on tco2559
  fesom-interpolated-2d:
    path: '{{ grids }}/FESOM/fesom_tco2559_interpolated_2d.nc'
    space_coord: ["lon", "lat"]
  fesom-interpolated-3d:
    path: '{{ grids }}/FESOM/fesom_tco2559_interpolated_3d.nc'
    space_coord: ["lon", "lat"]

  # ICON v2: ClimateDT phase2. 3d grids have 72 levels starting at 1
  icon-R02B08-hpz9-nested-v2:  # 924355 missing values
    path: '{{ grids }}/HealPix/icon-R02B08_hpz9_nested_oce_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  icon-R02B08-hpz9-nested-3d-v2:
    path:
      level: '{{ grids }}/HealPix/icon-R02B08_hpz9_nested_oce_level_full_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  icon-R02B09-hpz7-nested-v2:  # 57642 missing values
    path: '{{ grids }}/HealPix/icon-R02B09_hpz7_nested_oce_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  icon-R02B09-hpz7-nested-3d-v2:
    path:
      level: '{{ grids }}/HealPix/icon-R02B09_hpz7_nested_oce_level_full_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  icon-R02B08-hpz6-nested-v2:  # 14415 missing values
    path: '{{ grids }}/HealPix/icon-R02B08_hpz6_nested_oce_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  icon-R02B08-hpz6-nested-3d-v2:
    path:
      level: '{{ grids }}/HealPix/icon-R02B08_hpz6_nested_oce_level_full_v2.nc'
    space_coord: ["cell"]
    cdo_options: '--force'
  # ICON native R02B08 mesh
  R02B08:
    path: '{{ grids }}/ICON/icon_grid_0033_R02B08_G.nc'
    space_coord: ["cell"]
    cdo_extra: -selname,cell_index
  # Same as R02B09 with space_coord ncells
  icon-R02B09-intaketest:
    path: '{{ grids }}/ICON/icon_grid_0015_R02B09_G.nc'
    space_coord: ["ncells"]
    cdo_extra: -selname,cell_index

  # NEMO HEALPix: ClimateDT phase1
  nemo-eORCA1-hpz5-nested:
    path: '{{ grids }}/HealPix/nemo-eORCA1_hpz5_nested_oce.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  nemo-eORCA1-hpz5-nested-3d:
    path:
      level: '{{ grids }}/HealPix/nemo-eORCA1_hpz5_nested_oce_level.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  # Same files as nemo-eORCA025-hpz7-nested(-3d)-v3
  nemo-eORCA025-hpz7-nested:
    path: '{{ grids }}/HealPix/nemo-eORCA025_hpz7_nested_oce.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  nemo-eORCA025-hpz7-nested-3d:
    path:
      level: '{{ grids }}/HealPix/nemo-eORCA025_hpz7_nested_oce_level.nc'
    space_coord: ["ncells"]
    cdo_options: '--force'
  nemo-healpix:
    path:
      2d: '{{ grids }}/HealPix_old/nemo_hpx10_oce_2d.nc'
      level: '{{ grids }}/HealPix_old/nemo_hpx10_oce_level.nc'
    space_coord: ["ncells"]
  # NEMO eORCA025 multIO r360x181 conservative interpolation
  nemo-eORCA025-r100s-v3:
    path: '{{ grids }}/NEMO/nemo-eORCA025-r100s_v3.nc'
  nemo-eORCA025-r100s-3d-v3:
    path:
      level: '{{ grids }}/NEMO/nemo-eORCA025-r100s-3d_v3.nc'
  # NEMO native ORCA meshes (level and height entries share the same file)
  eORCA1-3d-level:
    path:
      level: '{{ grids }}/NEMO/eORCA1_mesh_3d_grid_T_level.nc'
    space_coord: ["ncells"]
  eORCA1-3d-height:
    path:
      height: '{{ grids }}/NEMO/eORCA1_mesh_3d_grid_T_level.nc'
    space_coord: ["ncells"]
  eORCA025-2d:
    path: '{{ grids }}/NEMO/eORCA025_mesh_sfc_grid_T.nc'
  eORCA025-3d-level:
    path:
      level: '{{ grids }}/NEMO/eORCA025_mesh_3d_grid_T_level.nc'
    space_coord: ["ncells"]
  eORCA025-3d-height:
    path:
      height: '{{ grids }}/NEMO/eORCA025_mesh_3d_grid_T_level.nc'
    space_coord: ["ncells"]
  eORCA12-3d-height:
    path:
      height: '{{ grids }}/NEMO/eORCA12_mesh_3d_grid_T_level.nc'
    space_coord: ["ncells"]

  # Tests
  test-pi-3d-coord-fix:
    path:
      nz1: '{{ grids }}/FESOM/pi_fesom_mask_nz1.nc'
    cdo_extra:
      - -setgrid,{{ grids }}/FESOM/pi_griddes_nodes_IFS.nc
